name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: [ '7.0.x' ]
        node-version: [ '18.x' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Create CI nuget.config
      shell: bash
      run: |
        cat > nuget.ci.config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
        </configuration>
        EOF

    - name: Configure Artifactory feed
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
        ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
      run: |
        echo "Checking Artifactory secrets and variables availability..."
        if [ -z "$ARTIFACTORY_URL" ]; then
          echo "ERROR: ARTIFACTORY_URL secret is not set. Add it under Repository Settings → Secrets and Variables → Actions.";
          exit 1;
        fi
        if [ -z "$ARTIFACTORY_USER" ]; then
          echo "Warning: ARTIFACTORY_USER is empty — some feeds accept only an API key. Proceeding if DEMO_API_KEY is set.";
        fi
        if [ -z "$ARTIFACTORY_PASSWORD" ] && [ -z "$DEMO_API_KEY" ]; then
          echo "ERROR: Neither ARTIFACTORY_PASSWORD nor DEMO_API_KEY is set. Provide one of them as a secret.";
          exit 1;
        fi
        echo "Secrets/vars present: ARTIFACTORY_URL=$( [ -n \"$ARTIFACTORY_URL\" ] && echo true || echo false ), ARTIFACTORY_USER=$( [ -n \"$ARTIFACTORY_USER\" ] && echo true || echo false ), ARTIFACTORY_PASSWORD=$( [ -n \"$ARTIFACTORY_PASSWORD\" ] && echo true || echo false ), DEMO_API_KEY=$( [ -n \"$DEMO_API_KEY\" ] && echo true || echo false ), APP_ENVIRONMENT=$( [ -n \"$APP_ENVIRONMENT\" ] && echo true || echo false )"
        # Prefer API key if provided
        AUTH_PASS="$ARTIFACTORY_PASSWORD"
        if [ -n "$DEMO_API_KEY" ]; then
          AUTH_PASS="$DEMO_API_KEY"
        fi
        dotnet nuget add source "$ARTIFACTORY_URL" --name Artifactory --username "$ARTIFACTORY_USER" --password "$AUTH_PASS" --store-password-in-clear-text --configfile nuget.ci.config

    - name: Restore NuGet packages (server and client)
      run: |
        dotnet restore ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configfile nuget.ci.config
        dotnet restore ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configfile nuget.ci.config

    - name: Install client dependencies
      working-directory: ./employeemanagementsystem2.client
      run: npm ci

    - name: Build server project
      run: dotnet build ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configuration Release --no-restore

    - name: Build client project (dotnet)
      run: |
        dotnet build ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configuration Release --no-restore || true

    - name: Build client (node)
      working-directory: ./employeemanagementsystem2.client
      run: npm run build --if-present

    - name: Run server tests
      run: dotnet test ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --no-build --verbosity normal

    - name: Lint client
      working-directory: ./employeemanagementsystem2.client
      run: |
        if (Test-Path package.json) {
          npm run lint --if-present
        } else {
          Write-Host "No package.json found, skipping client lint"
        }
