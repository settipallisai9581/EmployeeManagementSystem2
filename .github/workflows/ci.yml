name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: [ '7.0.x' ]
        node-version: [ '18.x' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Create CI nuget.config
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL || vars.ARTIFACTORY_URL }}
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER || vars.ARTIFACTORY_USER }}
        ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD || vars.ARTIFACTORY_PASSWORD }}
        DEMO_API_KEY: ${{ secrets.DEMO_API_KEY || vars.DEMO_API_KEY }}
      run: |
        cat > nuget.ci.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
        EOF

        if [ -n "$ARTIFACTORY_URL" ]; then
          echo "        <add key=\"Artifactory\" value=\"$ARTIFACTORY_URL\" />" >> nuget.ci.config
        fi

        cat >> nuget.ci.config <<EOF
          </packageSources>
        </configuration>
        EOF

        echo "CI NuGet config created. nuget.org is always enabled. Artifactory is included only when ARTIFACTORY_URL is set."

    - name: Configure Artifactory feed
      if: ${{ env.ARTIFACTORY_URL != '' }}
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL || vars.ARTIFACTORY_URL }}
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER || vars.ARTIFACTORY_USER }}
        ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD || vars.ARTIFACTORY_PASSWORD }}
        DEMO_API_KEY: ${{ secrets.DEMO_API_KEY || vars.DEMO_API_KEY }}
      run: |
        if [ -z "$ARTIFACTORY_URL" ]; then
          echo "No Artifactory URL configured; skipping feed configuration."
          exit 0
        fi
        AUTH_PASS="$ARTIFACTORY_PASSWORD"
        if [ -z "$AUTH_PASS" ] && [ -n "$DEMO_API_KEY" ]; then
          AUTH_PASS="$DEMO_API_KEY"
        fi
        if [ -n "$ARTIFACTORY_USER" ] && [ -n "$AUTH_PASS" ]; then
          dotnet nuget add source "$ARTIFACTORY_URL" --name Artifactory --username "$ARTIFACTORY_USER" --password "$AUTH_PASS" --store-password-in-clear-text --configfile nuget.ci.config
        else
          echo "Artifactory URL exists, but no credentials were supplied; skipping source registration."
        fi

    - name: Restore NuGet packages (server and client)
      run: |
        dotnet restore ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configfile nuget.ci.config
        dotnet restore ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configfile nuget.ci.config

    - name: Install client dependencies
      working-directory: ./employeemanagementsystem2.client
      run: npm ci

    - name: Build server project
      run: dotnet build ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configuration Release --no-restore

    - name: Build client project (dotnet)
      run: |
        dotnet build ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configuration Release --no-restore || true

    - name: Build client (node)
      working-directory: ./employeemanagementsystem2.client
      run: npm run build --if-present

    - name: Run server tests
      run: dotnet test ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --no-build --verbosity normal

    - name: Lint client
      working-directory: ./employeemanagementsystem2.client
      run: |
        if (Test-Path package.json) {
          npm run lint --if-present
        } else {
          Write-Host "No package.json found, skipping client lint"
        }
