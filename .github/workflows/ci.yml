name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: [ '7.0.x' ]
        node-version: [ '18.x' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Create CI nuget.config
      shell: bash
      run: |
        cat > nuget.ci.config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
        </configuration>
        EOF

    - name: Configure Artifactory feed
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL || vars.ARTIFACTORY_URL }}
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER || vars.ARTIFACTORY_USER }}
        ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD || vars.ARTIFACTORY_PASSWORD }}
        DEMO_API_KEY: ${{ secrets.DEMO_API_KEY || vars.DEMO_API_KEY }}
        APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
      run: |
        echo "Checking Artifactory secrets and variables availability..."
        echo "APP_ENVIRONMENT status: $( [ -n \"$APP_ENVIRONMENT\" ] && echo set || echo not-set )"
        echo "ARTIFACTORY_URL status: $( [ -n \"$ARTIFACTORY_URL\" ] && echo set || echo not-set )"
        echo "ARTIFACTORY_USER status: $( [ -n \"$ARTIFACTORY_USER\" ] && echo set || echo not-set )"
        echo "ARTIFACTORY_PASSWORD status: $( [ -n \"$ARTIFACTORY_PASSWORD\" ] && echo set || echo not-set )"
        echo "DEMO_API_KEY status: $( [ -n \"$DEMO_API_KEY\" ] && echo set || echo not-set )"

        if [ -z "$ARTIFACTORY_URL" ]; then
          echo "No Artifactory URL configured. Skipping Artifactory source and continuing with nuget.org only."
          exit 0
        fi

        if [ -z "$ARTIFACTORY_USER" ] && [ -z "$ARTIFACTORY_PASSWORD" ] && [ -z "$DEMO_API_KEY" ]; then
          echo "Artifactory URL is configured, but no credential was found. Skipping Artifactory source and continuing with nuget.org only."
          exit 0
        fi

        AUTH_PASS="$ARTIFACTORY_PASSWORD"
        if [ -z "$AUTH_PASS" ] && [ -n "$DEMO_API_KEY" ]; then
          AUTH_PASS="$DEMO_API_KEY"
        fi

        echo "Adding Artifactory feed to nuget config..."
        dotnet nuget add source "$ARTIFACTORY_URL" --name Artifactory --username "$ARTIFACTORY_USER" --password "$AUTH_PASS" --store-password-in-clear-text --configfile nuget.ci.config

    - name: Restore NuGet packages (server and client)
      run: |
        dotnet restore ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configfile nuget.ci.config
        dotnet restore ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configfile nuget.ci.config

    - name: Install client dependencies
      working-directory: ./employeemanagementsystem2.client
      run: npm ci

    - name: Build server project
      run: dotnet build ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configuration Release --no-restore

    - name: Build client project (dotnet)
      run: |
        dotnet build ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configuration Release --no-restore || true

    - name: Build client (node)
      working-directory: ./employeemanagementsystem2.client
      run: npm run build --if-present

    - name: Run server tests
      run: dotnet test ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --no-build --verbosity normal

    - name: Lint client
      working-directory: ./employeemanagementsystem2.client
      run: |
        if (Test-Path package.json) {
          npm run lint --if-present
        } else {
          Write-Host "No package.json found, skipping client lint"
        }
