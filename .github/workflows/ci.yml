name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: [ '8.0.x' ]
        node-version: [ '20.x', '22.x' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Create CI nuget.config
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL || vars.ARTIFACTORY_URL }}
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER || vars.ARTIFACTORY_USER }}
        ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD || vars.ARTIFACTORY_PASSWORD }}
        DEMO_API_KEY: ${{ secrets.DEMO_API_KEY || vars.DEMO_API_KEY }}
      run: |
        AUTH_PASS="${ARTIFACTORY_PASSWORD:-$DEMO_API_KEY}"

        cat > nuget.ci.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
        EOF

        if [ -n "$ARTIFACTORY_URL" ]; then
          echo "    <add key=\"Artifactory\" value=\"$ARTIFACTORY_URL\" />" >> nuget.ci.config
        fi

        cat >> nuget.ci.config <<EOF
          </packageSources>
        EOF

        if [ -n "$ARTIFACTORY_URL" ] && { [ -n "$ARTIFACTORY_USER" ] || [ -n "$AUTH_PASS" ]; }; then
          USERNAME_LINE=""
          PASSWORD_LINE=""
          if [ -n "$ARTIFACTORY_USER" ]; then
            USERNAME_LINE="      <add key=\"Username\" value=\"$ARTIFACTORY_USER\" />"
          fi
          if [ -n "$AUTH_PASS" ]; then
            PASSWORD_LINE="      <add key=\"ClearTextPassword\" value=\"$AUTH_PASS\" />"
          fi

          cat >> nuget.ci.config <<EOF
          <packageSourceCredentials>
            <Artifactory>
        EOF

          if [ -n "$USERNAME_LINE" ]; then
            printf '%s\n' "$USERNAME_LINE" >> nuget.ci.config
          fi
          if [ -n "$PASSWORD_LINE" ]; then
            printf '%s\n' "$PASSWORD_LINE" >> nuget.ci.config
          fi

          cat >> nuget.ci.config <<EOF
            </Artifactory>
          </packageSourceCredentials>
        EOF
        fi

        cat >> nuget.ci.config <<EOF
        </configuration>
        EOF

        echo "CI NuGet config created. nuget.org is always enabled. Artifactory is added only when ARTIFACTORY_URL is set and credentials are available."

    - name: Restore NuGet packages (server and client)
      shell: bash
      run: |
        set -e
        retry() {
          local n=1
          local max=3
          local delay=5
          until [ $n -ge $max ]
          do
            "$@" && break || {
              echo "Command failed: $@. Attempt $n/$max. Retrying in $delay seconds...";
              sleep $delay;
              n=$((n+1));
              delay=$((delay*2));
            }
          done
          if [ $n -ge $max ]; then
            echo "Command '$*' failed after $max attempts.";
            return 1
          fi
        }

        retry dotnet restore ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configfile nuget.ci.config
        retry dotnet restore ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configfile nuget.ci.config || true

    - name: Install client dependencies
      working-directory: ./employeemanagementsystem2.client
      run: npm ci

    - name: Build server project
      run: dotnet build ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --configuration Release --no-restore

    - name: Build client project (dotnet)
      run: |
        dotnet build ./employeemanagementsystem2.client/employeemanagementsystem2.client.esproj --configuration Release --no-restore

    - name: Build client (node)
      working-directory: ./employeemanagementsystem2.client
      run: npm run build --if-present

    - name: Run server tests
      run: dotnet test ./EmployeeManagementSystem2.Server/EmployeeManagementSystem2.Server.csproj --no-build --verbosity normal

    - name: Lint client
      working-directory: ./employeemanagementsystem2.client
      run: |
        if (Test-Path package.json) {
          npm run lint --if-present
        } else {
          Write-Host "No package.json found, skipping client lint"
        }
